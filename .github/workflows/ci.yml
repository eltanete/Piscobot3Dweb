name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Auditoría de dependencias (sin vulnerabilidades altas)
        run: npm audit --audit-level=high --omit=dev
      - run: npm run lint
      - run: npm run check
      - run: npm test --if-present
      - name: Build estático (Hostinger PHP/HTML)
        run: npm run build
        env:
          DEPLOY_TARGET: static
      - name: Links, botones y SEO (sin destinos rotos, un H1, titles únicos)
        run: npm run auditar
      - name: Build Node
        run: npm run build
        env:
          DEPLOY_TARGET: node
